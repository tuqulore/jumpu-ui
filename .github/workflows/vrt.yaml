name: VRT
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  playwright-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' packages/docs/package.json)" >> "$GITHUB_OUTPUT"
  vrt:
    needs: playwright-version
    runs-on: ubuntu-24.04
    # NOTE: baseline はこのコンテナで生成している。ブラウザとフォントを揃えるため、ランナー上で直接実行しない
    container: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - uses: tuqulore/.github/setup@cc8a49114d24092c90de619edef3518534fb074e # main
      - run: pnpm --filter @jumpu-ui/docs build
      - run: pnpm --filter @jumpu-ui/docs vrt
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-report
          path: |
            packages/docs/playwright-report
            packages/docs/test-results
